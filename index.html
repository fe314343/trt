<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雷德斯科技 | Raiders TRT - 專業廢水減廢技術</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 使用 Lucide Core 替代 Lucide React UMD 以解決 forwardRef 錯誤 -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'pulse-slow': 'pulse-slow 8s ease-in-out infinite',
                    },
                    keyframes: {
                        'pulse-slow': {
                            '0%, 100%': { opacity: 0.35, transform: 'scale(1.05)' },
                            '50%': { opacity: 0.5, transform: 'scale(1.08)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; scroll-behavior: smooth; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // 建立一個穩定的圖標組件，避開 UMD 的 forwardRef 問題
        const Icon = ({ name, className = "w-5 h-5", size = 20 }) => {
            useEffect(() => {
                // 每次組件渲染後執行 Lucide 解析
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);

            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [activeTab, setActiveTab] = useState('chemicals');
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                // 初始載入圖標
                if (window.lucide) window.lucide.createIcons();
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const productData = {
                chemicals: [
                    { id: 'trt-nao', name: 'TRT-NAO 奈米吸附劑', feature: '高難度 COD 降解', detail: '針對振動研磨、高濃度化學鎳廢液開發，COD 移除率可達 95% 以上。' },
                    { id: 'trt-mc2', name: 'TRT-MC2 金屬捕集劑', feature: '重金屬離子移除', detail: '對銅、鎳、鋅具極強螯合力，沈降快速且不回溶。' },
                    { id: 'trt-fb', name: 'TRT-FB 除氟混凝劑', feature: '電子業除氟專用', detail: '將氟離子穩定降至 10ppm 以下，同時減少大量化學污泥產生。' },
                    { id: 'trt-oc', name: 'TRT-OC COD 分解劑', feature: '後段精修處理', detail: '作為放流水前的最後一道安全防線。' }
                ],
                equipment: [
                    { id: 'rst-3500', name: 'RST 精密刮泥沈澱槽', feature: '專利無死角設計', detail: '一體化沈澱與濃縮，大幅提升污泥脫水機效率。' },
                    { id: 'ff-1000', name: 'FF 自動逆洗過濾塔', feature: '全自動免人工', detail: '採壓差與時序雙重模式，確保過濾層永不堵塞。' },
                    { id: 'hpf-800', name: 'HPF 中高壓脫水機', feature: '減容率 80%', detail: '結構強度高，顯著縮短脫水週期。' }
                ]
            };

            return (
                <div className="min-h-screen bg-white text-slate-900">
                    {}
                    <nav className={`fixed w-full z-50 transition-all duration-300 ${scrolled ? 'glass-nav shadow-md py-3' : 'bg-transparent py-5'}`}>
                        <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold shadow-lg shadow-blue-500/20 text-xl">TRT</div>
                                <div className="flex flex-col">
                                    <span className={`text-xl font-black tracking-tight leading-none ${scrolled ? 'text-slate-900' : 'text-white'}`}>雷德斯科技</span>
                                    <span className={`text-[10px] uppercase tracking-widest mt-1 ${scrolled ? 'text-slate-500' : 'text-blue-200'}`}>Waste Reduction Tech</span>
                                </div>
                            </div>
                            <div className={`hidden md:flex gap-8 items-center font-bold text-sm ${scrolled ? 'text-slate-600' : 'text-white/90'}`}>
                                <a href="#技術" className="hover:text-blue-500 transition-colors">核心技術</a>
                                <a href="#產品" className="hover:text-blue-500 transition-colors">產品清單</a>
                                <button className="bg-blue-600 text-white px-6 py-2.5 rounded-full hover:bg-blue-700 transition-all shadow-lg shadow-blue-600/30 flex items-center gap-2">
                                    <Icon name="phone" size={16} /> 預約諮詢
                                </button>
                            </div>
                        </div>
                    </nav>

                    {}
                    <header className="relative h-screen flex items-center justify-center overflow-hidden bg-slate-900">
                        <div className="absolute inset-0 z-0">
                            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=2000&auto=format&fit=crop" className="w-full h-full object-cover opacity-40 animate-pulse-slow" alt="Background" />
                            <div className="absolute inset-0 bg-gradient-to-b from-slate-900/40 via-slate-900/60 to-slate-900"></div>
                        </div>
                        <div className="relative z-10 max-w-5xl mx-auto px-6 text-center">
                            <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-blue-500/10 border border-blue-400/30 text-blue-400 text-sm font-bold mb-8 backdrop-blur-md">
                                <Icon name="award" size={16} /> 35 年水處理實戰經驗
                            </div>
                            <h1 className="text-5xl md:text-8xl font-black text-white leading-tight mb-8">
                                從廢水之中 <br />
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400">萃取永續價值</span>
                            </h1>
                            <p className="text-lg md:text-2xl text-slate-300 mb-12 max-w-2xl mx-auto font-medium">
                                專利減廢技術：降低 90% 污泥量，讓高難度廢水處理變得經濟高效。
                            </p>
                            <div className="flex flex-col sm:flex-row gap-4 justify-center">
                                <a href="#產品" className="bg-blue-600 text-white px-10 py-5 rounded-2xl font-bold text-lg hover:bg-blue-700 transition-all flex items-center justify-center gap-2 shadow-xl shadow-blue-600/20">
                                    解決方案 <Icon name="arrow-right" size={20} />
                                </a>
                            </div>
                        </div>
                    </header>

                    {}
                    <section id="技術" className="py-24 bg-slate-50">
                        <div className="max-w-7xl mx-auto px-6">
                            <div className="text-center mb-16">
                                <h2 className="text-4xl font-black text-slate-900 mb-4">突破業界瓶頸的處理成效</h2>
                                <p className="text-slate-500">真實案場數據：透過 TRT 藥劑與專利設備實現極致減廢</p>
                            </div>
                            <div className="grid md:grid-cols-2 gap-12">
                                <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                                    <div className="flex justify-between font-bold mb-4">
                                        <span className="flex items-center gap-2"><Icon name="trending-down" className="text-blue-600" /> 振動研磨廢液 COD 處理</span>
                                        <span className="text-blue-600">移除率 97.5%</span>
                                    </div>
                                    <div className="h-4 bg-slate-100 rounded-full overflow-hidden">
                                        <div className="h-full bg-blue-600 rounded-full" style={{width: '97.5%'}}></div>
                                    </div>
                                    <div className="flex justify-between text-xs mt-4 text-slate-400 font-bold uppercase tracking-wider">
                                        <span>原始: 24,000 ppm</span>
                                        <span>TRT 後: 600 ppm</span>
                                    </div>
                                </div>
                                <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                                    <div className="flex justify-between font-bold mb-4">
                                        <span className="flex items-center gap-2"><Icon name="shield-check" className="text-cyan-500" /> 化學鎳廢液鎳離子 (Ni)</span>
                                        <span className="text-cyan-600">移除率 99.8%</span>
                                    </div>
                                    <div className="h-4 bg-slate-100 rounded-full overflow-hidden">
                                        <div className="h-full bg-cyan-500 rounded-full" style={{width: '99.8%'}}></div>
                                    </div>
                                    <div className="flex justify-between text-xs mt-4 text-slate-400 font-bold uppercase tracking-wider">
                                        <span>原始: 60,000 ppm</span>
                                        <span>TRT 後: 100 ppm</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {}
                    <section id="產品" className="py-24 bg-white">
                        <div className="max-w-7xl mx-auto px-6">
                            <div className="flex justify-center p-1 bg-slate-100 rounded-2xl mb-12 w-fit mx-auto">
                                <button onClick={() => setActiveTab('chemicals')} className={`px-8 py-3 rounded-xl font-bold transition-all ${activeTab === 'chemicals' ? 'bg-white shadow-md text-blue-600' : 'text-slate-500'}`}>水處理藥劑</button>
                                <button onClick={() => setActiveTab('equipment')} className={`px-8 py-3 rounded-xl font-bold transition-all ${activeTab === 'equipment' ? 'bg-white shadow-md text-blue-600' : 'text-slate-500'}`}>專利設備</button>
                            </div>
                            <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                                {productData[activeTab].map((p) => (
                                    <div key={p.id} className="group p-8 rounded-[2rem] border border-slate-100 hover:border-blue-200 hover:shadow-2xl hover:shadow-blue-900/5 transition-all flex flex-col bg-white">
                                        <div className="text-[10px] font-black text-blue-500 mb-4 px-3 py-1 bg-blue-50 rounded-full w-fit">{p.feature}</div>
                                        <h3 className="text-lg font-bold mb-3 group-hover:text-blue-600 transition-colors">{p.name}</h3>
                                        <p className="text-slate-500 text-sm mb-6 flex-grow leading-relaxed">{p.detail}</p>
                                        <button className="flex items-center gap-2 text-sm font-bold text-blue-600 group-hover:gap-3 transition-all">
                                            了解細節 <Icon name="chevron-right" size={14} />
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {}
                    <footer className="bg-slate-900 text-white py-24 px-6">
                        <div className="max-w-7xl mx-auto grid lg:grid-cols-2 gap-20">
                            <div>
                                <h2 className="text-4xl font-black mb-6">聯繫雷德斯科技</h2>
                                <p className="text-slate-400 mb-10 text-lg leading-relaxed">無論是 COD 超標、重金屬無法排放、或是污泥處理費高昂，我們的工程師將為您提供初步水質分析。</p>
                                <div className="space-y-6">
                                    <div className="flex items-center gap-4">
                                        <div className="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center text-blue-400"><Icon name="phone" /></div>
                                        <div><p className="text-xs text-slate-500 font-bold uppercase tracking-widest">電話</p><p className="font-bold">02-2286-6693</p></div>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <div className="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center text-blue-400"><Icon name="mail" /></div>
                                        <div><p className="text-xs text-slate-500 font-bold uppercase tracking-widest">Email</p><p className="font-bold">trt9002@yahoo.com.tw</p></div>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <div className="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center text-blue-400"><Icon name="map-pin" /></div>
                                        <div><p className="text-xs text-slate-500 font-bold uppercase tracking-widest">地址</p><p className="font-bold">新北市三重區溪尾街126巷15號</p></div>
                                    </div>
                                </div>
                            </div>
                            <div className="bg-white p-10 rounded-[3rem] shadow-2xl">
                                <form className="space-y-4 text-slate-900" onSubmit={e => e.preventDefault()}>
                                    <div className="grid md:grid-cols-2 gap-4">
                                        <input className="w-full p-4 bg-slate-50 rounded-2xl border border-slate-100 focus:outline-none focus:border-blue-500" placeholder="您的姓名" />
                                        <input className="w-full p-4 bg-slate-50 rounded-2xl border border-slate-100 focus:outline-none focus:border-blue-500" placeholder="聯絡電話" />
                                    </div>
                                    <textarea className="w-full p-4 bg-slate-50 rounded-2xl border border-slate-100 h-32 focus:outline-none focus:border-blue-500" placeholder="您的廢水處理需求描述..."></textarea>
                                    <button className="w-full bg-blue-600 text-white py-5 rounded-2xl font-bold text-lg hover:bg-blue-700 transition-all shadow-xl shadow-blue-600/20">
                                        立即送出申請
                                    </button>
                                </form>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto mt-20 pt-8 border-t border-white/10 text-center text-slate-500 text-xs">
                            © {new Date().getFullYear()} 雷德斯減廢科技有限公司 | 統一編號: 12755761
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

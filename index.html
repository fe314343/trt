                                <p className="text-slate-500 font-light text-sm mt-4">提供您的廢水屬性，我們將安排環境工程師為您提供專業諮詢。</p>
                            </div>
                            
                            {formSubmitted ? (
                                <div className="bg-trt-light-green p-12 text-center shadow-md animate-fade-in-up">
                                    <Icon name="check-circle" size={48} className="text-trt-green mx-auto mb-6" />
                                    <h3 className="text-2xl font-black text-trt-blue mb-4">諮詢申請已送出！</h3>
                                    <p className="text-slate-600 text-sm">技術部門將於 24 小時內與您聯繫。</p>
                                    <button onClick={() => setFormSubmitted(false)} className="mt-8 text-trt-blue font-bold text-xs underline">重新填寫</button>
                                </div>
                            ) : (
                                <div className="bg-slate-50 border border-slate-200 p-10 shadow-sm">
                                    <form onSubmit={handleFormSubmit} className="space-y-8">
                                        <div className="grid md:grid-cols-2 gap-6">
                                            <input type="text" required className="w-full bg-white border border-slate-200 px-5 py-4 focus:outline-none focus:border-trt-green text-sm" placeholder="姓名 *" />
                                            <input type="tel" required className="w-full bg-white border border-slate-200 px-5 py-4 focus:outline-none focus:border-trt-green text-sm" placeholder="電話 *" />
                                        </div>
                                        <input type="text" required className="w-full bg-white border border-slate-200 px-5 py-4 focus:outline-none focus:border-trt-green text-sm" placeholder="公司名稱 / 廠區 *" />
                                        <div>
                                            <label className="block text-xs font-black text-slate-500 uppercase tracking-widest mb-4">想解決的成分 (複選) *</label>
                                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                                {['高濃度 COD', '總氮 / 氨氮', '劇毒六價鉻', '污泥含水率'].map((c) => (
                                                    <label key={c} className="flex items-center gap-2 cursor-pointer text-xs font-medium text-slate-600">
                                                        <input type="checkbox" checked={formData.compounds.includes(c)} onChange={() => handleCheckboxChange(c)} className="accent-trt-green w-4 h-4" /> {c}
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                        <button type="submit" className="w-full bg-trt-green text-white py-5 font-black text-sm tracking-widest uppercase transition-all hover:bg-trt-blue">送出預約專人聯繫</button>
                                    </form>
                                </div>
                            )}
                        </div>
                    </section>

                    <footer className="bg-slate-950 text-white py-24 px-6 text-center">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-10">
                            <div className="text-left">
                                <h3 className="text-2xl font-black mb-2">台灣雷德斯減廢科技</h3>
                                <p className="text-slate-500 text-sm font-light">秉持 35 年技術，致力於高難度廢液資源化。</p>
                            </div>
                            <div className="text-slate-400 text-sm font-bold flex flex-col gap-2 text-left border-l border-white/10 pl-10">
                                <li className="list-none">電話：02-2286-6693</li>
                                <li className="list-none">地址：新北市三重區溪尾街126巷15號</li>
                            </div>
                        </div>
                        <div className="mt-20 pt-8 border-t border-white/5 text-[10px] text-slate-600 tracking-widest">© 2026 Taiwan Raiders Waste Reduction Technology Corp.</div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

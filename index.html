<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣雷德斯減廢科技股份有限公司</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-white text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const chemicalDatabase = {
            cod: {
                groupTitle: "TRT COD 降解系列",
                items: [
                    { id: 'trt-na', name: 'TRT-NA 奈米吸附強效混凝劑', type: '粉體', img: 'potion_NA.webp', desc: '適用於振動研磨等高 COD 環境。' },
                    { id: 'trt-l1', name: 'TRT-L1 多用途強效液態混凝劑', type: '液體', img: 'Potion-L1.webp', desc: '用於複雜廢水處理。' },
                    { id: 'trt-nao', name: 'TRT-NAO 奈米級強效粉體混凝劑', type: '粉體', img: 'agent_Nano-adsorption-coagulation.webp', desc: '懸浮固體與溶解性膠體沉降迅速。' },
                    { id: 'trt-oc', name: 'TRT-OC 溶解性 COD 分解劑', type: '液體', img: 'Strengthen-the-decomposition-of-soluble-COD.webp', desc: '適用於中低濃度有機物降解。' },
                    { id: 'trt-cao', name: 'TRT-CaO 溶解性 COD 催化劑', type: '液體', img: 'potion_CaO.webp', desc: '充分裂解大分子 COD。' },
                    { id: 'trt-s8000', name: 'TRT-S8000 活性碳 COD 吸附粉劑', type: '粉體', img: 'agent_activated-carbon.webp', desc: '高碘值、粒徑小於 200mesh。' }
                ]
            },
            fluoride: {
                groupTitle: "TRT 除氟系列",
                items: [
                    { id: 'trt-fb', name: 'TRT-FB 除氟粉體混凝劑', type: '粉體', img: 'potion_FB.webp', desc: '多孔性鈣鹽吸附劑。' },
                    { id: 'trt-k1', name: 'TRT-K1 除氟液態混凝劑', type: '液體', img: 'potion_K1.webp', desc: '針對各類高低濃度的氟離子進行架橋去除。' }
                ]
            },
            nitrogen: {
                groupTitle: "TRT 總氮去除系列",
                items: [
                    { id: 'trt-can', name: 'TRT-CaN 總氮觸媒反應劑', type: '液體', img: 'potion_CaN.webp', desc: '適用於硝酸製程排水。' }
                ]
            },
            cyanide: {
                groupTitle: "TRT 氰化物去除系列",
                items: [
                    { id: 'trt-dow-cn', name: 'TRT-DOW 高濃度氰化物分解主劑', type: '液體', img: 'High-Concentrations-of-Cyanide-Overcome.webp', desc: '分解率高達 99.99%。' }
                ]
            }
        };

        const App = () => {
            const [selectedGroup, setSelectedGroup] = useState('cod');
            const [selectedItem, setSelectedItem] = useState(chemicalDatabase.cod.items[0]);

            return (
                <div className="max-w-6xl mx-auto p-8">
                    <h1 className="text-3xl font-black mb-8 text-slate-900">TRT 藥劑產品資料庫</h1>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                        <div className="space-y-4">
                            {Object.keys(chemicalDatabase).map(key => (
                                <button key={key} onClick={() => { setSelectedGroup(key); setSelectedItem(chemicalDatabase[key].items[0]); }} className="block w-full text-left p-4 bg-slate-100 hover:bg-slate-200 font-bold">
                                    {chemicalDatabase[key].groupTitle}
                                </button>
                            ))}
                        </div>
                        <div className="md:col-span-2 p-6 border rounded shadow-sm">
                            <div className="flex flex-col md:flex-row gap-6">
                                <div className="w-48 h-48 bg-slate-200 flex items-center justify-center overflow-hidden">
                                    <img src={selectedItem.img} alt={selectedItem.name} className="object-cover w-full h-full" onError={(e) => e.target.src='https://via.placeholder.com/200?text=無圖片'} />
                                </div>
                                <div>
                                    <h2 className="text-2xl font-black">{selectedItem.name}</h2>
                                    <p className="text-slate-600 mt-2">{selectedItem.desc}</p>
                                    <div className="mt-4 text-xs font-bold text-slate-400">劑型: {selectedItem.type}</div>
                                </div>
                            </div>
                            <div className="mt-8 grid grid-cols-3 gap-2">
                                {chemicalDatabase[selectedGroup].items.map(item => (
                                    <button key={item.id} onClick={() => setSelectedItem(item)} className="p-2 text-[11px] border text-center hover:bg-emerald-50">
                                        {item.name}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
